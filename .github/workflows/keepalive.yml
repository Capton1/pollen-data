name: keepalive

# GitHub disables scheduled workflows on a public repository after 60 days
# without repository activity. Re-enabling the publish workflow through the API
# once a month restarts that clock.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable publish.yml
